apply plugin: 'com.android.application'

// Include common definitions from the FTC SDK root
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // FTControl requirements (SDK 35 is recommended for Panels 1.0+)
    compileSdk 35
    defaultConfig {
        minSdk 24
    }
}

dependencies {
    // Links TeamCode to the primary robot controller application module
    implementation project(':FtcRobotController')

    // Third-party dashboard and motion profiling libraries
    implementation 'com.bylazar:fullpanels:1.0.12'
    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.1'
}
